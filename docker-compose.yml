services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Compose substitutes from a `.env` file next to this file (not `env_file` below).
      args:
        NEXT_PUBLIC_LEJEL_API_URL: ${NEXT_PUBLIC_LEJEL_API_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_LEJEL_API_KEY: ${NEXT_PUBLIC_LEJEL_API_KEY:-}
    container_name: lejel-custom-video-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env.local
    networks:
      - lejel-custom-video-network

networks:
  lejel-custom-video-network:
    external: true
    name: lejel-custom-video-network
